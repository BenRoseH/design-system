<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DS Storybook Sync</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: #1A1A1A;
      background: #fff;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 {
      font-size: 14px;
      font-weight: 700;
      color: #F15E00;
      letter-spacing: 0.02em;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      color: #1A1A1A;
      background: #fafafa;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, select:focus {
      border-color: #F15E00;
      background: #fff;
    }

    select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #fetch-btn {
      background: #f0f0f0;
      color: #1A1A1A;
    }

    #fetch-btn:not(:disabled):hover { background: #e4e4e4; }

    #sync-btn {
      background: #F15E00;
      color: #fff;
    }

    #sync-btn:not(:disabled):hover { background: #d45200; }

    #logs {
      height: 180px;
      overflow-y: auto;
      background: #f8f8f8;
      border: 1px solid #eee;
      border-radius: 6px;
      padding: 10px;
      font-size: 11px;
      line-height: 1.6;
      color: #444;
    }

    #logs p { margin: 0; }
    #logs p:not(:last-child) { margin-bottom: 2px; }
  </style>
</head>
<body>
  <h1>DS Storybook Sync</h1>

  <div>
    <label for="storybook-url">Storybook URL</label>
    <input
      id="storybook-url"
      type="text"
      value="http://localhost:6006"
      placeholder="http://localhost:6006"
    />
  </div>

  <div>
    <label for="component">Component</label>
    <select id="component" disabled>
      <option value="">— fetch stories first —</option>
    </select>
  </div>

  <div class="row">
    <button id="fetch-btn">Fetch Stories</button>
    <button id="sync-btn" disabled>Sync to Figma</button>
  </div>

  <div id="logs"></div>

  <script src="ui.js"></script>
</body>
</html>
